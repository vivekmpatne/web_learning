<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cricket Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Bat Ball Stump Game</h1>

    <button
      class="btn"
      onclick="
        var computerChoice = generateComputerChoice();

        let resultMsg = '';
        if (computerChoice === 'Bat') {
          resultMsg = 'You have tied';
        } else if (computerChoice === 'Ball') {
          resultMsg = 'You have won';
        } else if (computerChoice === 'Stump') {
          resultMsg = 'Computer has won';
        }

        alert(
          `You have chosen Bat \nComputer has chosen ${computerChoice} \n${resultMsg}`,
        );
      "
    >
      Bat
    </button>

    <button
      class="btn"
      onclick="
        var computerChoice = generateComputerChoice();

        if (computerChoice === 'Bat') {
          ResultMsg = 'Computer has won';
        } else if (computerChoice === 'Ball') {
          ResultMsg = 'You have tied';
        } else {
          ResultMsg = 'You have won';
        }

        alert(
          'You have chosen Ball\n' +
            'Computer has chosen ' +
            computerChoice +
            '\n' +
            ResultMsg,
        );
      "
    >
      Ball
    </button>

    <button
      class="btn"
      onclick="
        var computerChoice = generateComputerChoice();

        if (computerChoice === 'Bat') {
          resultMsg = 'You have won';
        } else if (computerChoice === 'Ball') {
          resultMsg = 'Computer has won';
        } else if (computerChoice === 'Stump') {
          resultMsg = 'You have tied';
        }

        alert(`You have chosen Stump
Computer has chosen ${computerChoice}
${resultMsg}`);
      "
    >
      Stump
    </button>

    <script>
      function generateComputerChoice() {
        let randNum = Math.random() * 3;
        if (randNum > 0 && randNum <= 1) {
          return "Bat";
        } else if (randNum > 1 && randNum <= 2) {
          return "Ball";
        } else {
          return "Stump";
        }
      }
    </script>
  </body>
</html>
